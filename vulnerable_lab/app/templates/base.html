<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="CyberNetra Controlled Vulnerable Web Lab — Isolated security testing sandbox for AI-powered threat detection.">
    <title>{% block title %}Apex Enterprise Portal{% endblock %} | CyberNetra Lab</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛡️</text></svg>">
</head>
<body>
    <header class="top-nav">
        <div class="nav-container">
            <div class="brand">
                <svg class="brand-shield-svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
                <a href="/" class="brand-name">Apex Enterprise Portal</a>
                <span class="badge-lab">Sandbox</span>
            </div>
            <nav class="nav-links">
                <a href="/">Home</a>
                <a href="/search">Search</a>
                <a href="/feedback">Feedback</a>
                <a href="/admin">Admin Area</a>
                <a href="/auth/login" class="btn-login">Staff Login</a>
            </nav>
        </div>
    </header>

    <main class="main-container">
        {% block content %}{% endblock %}
    </main>

    <footer class="footer">
        <p>CyberNetra AI &nbsp;|&nbsp; Controlled Vulnerable Web Lab &nbsp;|&nbsp; Smart India Hackathon 2026 &nbsp;|&nbsp; Port 9000 &nbsp;|&nbsp; Isolated Sandbox</p>
    </footer>

    <!-- Toast notification container -->
    <div id="toast-container" class="toast-container"></div>

    <!-- Shared JS utilities & Demo Mode Controller -->
    <script>
        // ── Toast Notification System (No Emojis) ──
        function showToast(message, type = 'success', duration = 3500) {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `toast toast-${type}`;
            const tags = { success: '[OK]', danger: '[ALERT]', warning: '[WARN]' };
            toast.innerHTML = `<span class="toast-tag font-mono">${tags[type] || '[INFO]'}</span><span class="toast-msg">${message}</span>`;
            container.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translateX(20px)';
                toast.style.transition = 'all 0.3s ease';
                setTimeout(() => toast.remove(), 300);
            }, duration);
        }

        // ── API Fetch Helper ──
        async function labFetch(url, options = {}) {
            try {
                const res = await fetch(url, {
                    headers: { 'Content-Type': 'application/json', ...options.headers },
                    ...options
                });
                return await res.json();
            } catch (err) {
                showToast(`Network error: ${err.message}`, 'danger');
                throw err;
            }
        }

        // ── Format timestamp for feed ──
        function formatTime(isoStr) {
            try {
                const d = new Date(isoStr);
                return d.toLocaleTimeString('en-US', { hour12: false, hour: '2-digit', minute: '2-digit', second: '2-digit' });
            } catch { return '--:--:--'; }
        }

        // ── Status code color ──
        function statusColor(code) {
            if (code < 300) return 'var(--accent-emerald)';
            if (code < 400) return 'var(--accent-cyan)';
            if (code < 500) return 'var(--accent-amber)';
            return 'var(--accent-rose)';
        }

        // ── Event type class ──
        function eventClass(type) {
            if (type === 'normal') return 'event-normal';
            if (type === 'rate_limit') return 'event-rate';
            return 'event-attack';
        }
    </script>

    {% block scripts %}{% endblock %}
</body>
</html>
